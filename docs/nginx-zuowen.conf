# ============================================================
# 左文科技企业官网 - Nginx 生产配置
# 适用：Linux 服务器（阿里云 ECS / 腾讯云等）+ Next.js 独立部署 (PM2/systemd)
# 放置路径：/etc/nginx/conf.d/zuowen.conf （或 sites-available 并软链到 sites-enabled）
#
# 本配置包含：gzip 压缩、静态资源缓存、_next 长缓存、安全头、反向代理
# 部署前请把 example.com 替换为你的真实域名，把 192.168.0.236 替换为服务器内网/公网IP
# ============================================================

# ---------- 全局 gzip 配置（也可放 http 块 nginx.conf） ----------
gzip on;
gzip_vary on;
gzip_min_length 1024;          # 小于 1KB 不压缩（小文件压缩反而更大）
gzip_comp_level 5;             # 压缩级别 1-9，5 是速度与体积平衡点
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  application/wasm
  image/svg+xml
  font/ttf
  font/otf
  font/woff
  font/woff2;

server {
    listen 80;
    server_name example.com www.example.com;
    # 强制跳转 HTTPS（需先配置好证书）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    # ---- SSL 证书（阿里云/腾讯云免费证书或 certbot） ----
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 后端 Next.js 服务地址（PM2/systemd 监听 3000） ----
    set $next_upstream 127.0.0.1:3000;

    # ============ 静态资源长缓存 ============
    # Next.js 构建产物 _next/static 带哈希文件名，可放心长缓存 1 年
    location /_next/static/ {
        proxy_pass http://$next_upstream;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 如静态资源已部署到 CDN，可在此改为 CDN 域名（见 CDN 方案文档）
        # proxy_pass http://cdn.example.com/_next/static/;
    }

    # public 目录下上传的图片/文件（文件名含哈希或变动频繁，短缓存）
    location /uploads/ {
        proxy_pass http://$next_upstream;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 静态小文件（favicon、robots.txt、sitemap.xml）
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|pdf)$ {
        proxy_pass http://$next_upstream;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 字体文件长缓存
    location ~* \.(woff2?|ttf|otf|eot)$ {
        proxy_pass http://$next_upstream;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ============ 动态页面：不缓存 HTML，交给 Next/API 的 Cache-Control 控制 ============
    location / {
        proxy_pass http://$next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        # 上传文件大小限制（后台富文本图片上传）
        client_max_body_size 200m;
    }

    # ---- 访问日志 ----
    access_log /var/log/nginx/zuowen-access.log;
    error_log  /var/log/nginx/zuowen-error.log warn;
}
